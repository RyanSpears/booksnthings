services:
  booknthings:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booknthings
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDb__ConnectionString: ${MONGODB_CONNECTION_STRING}
      MongoDb__DatabaseName: booknthings
      MongoDb__BooksCollection: books
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: gpt-4.1-mini
