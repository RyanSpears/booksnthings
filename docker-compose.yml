services:
  booknthings:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booknthings
    ports:
      - "${BOOKNTHINGS_PORT:-8080}:8080"
    volumes:
      - "${BOOKNTHINGS_HOST_DATA_DIRECTORY:-/Users/ryanspears/OneDrive/Dev/Projects/BooksNThings/Data}:${BOOKNTHINGS_CONTAINER_DATA_DIRECTORY:-/data}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4.1-mini}
      LocalJsonStorage__DefaultDataDirectory: ${BOOKNTHINGS_CONTAINER_DATA_DIRECTORY:-/data}
